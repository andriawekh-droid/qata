{% extends 'base.html' %}

{% block title %}Ubah Password — Qata{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Ubah Password</h1>
    <form method="POST" autocomplete="off">
        <div class="form-group">
            <label for="current_password">Password Saat Ini</label>
            <input type="password" id="current_password" name="current_password" required autofocus>
        </div>
        <div class="form-group">
            <label for="new_password">Password Baru</label>
            <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72">
            <small>Minimal 8 karakter.</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Konfirmasi Password Baru</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72">
        </div>
        <div class="editor-actions">
            <a href="{{ url_for('dashboard.profile') }}" class="btn btn-secondary">Batal</a>
            <button type="submit" class="btn">Simpan Password Baru</button>
        </div>
    </form>
</div>
{% endblock %}
