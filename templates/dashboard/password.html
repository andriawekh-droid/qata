{% extends 'base.html' %}

{% block title %}{{ t('pw.title') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>{{ t('pw.heading') }}</h1>
    <form method="POST" autocomplete="off">
        <div class="form-group">
            <label for="current_password">{{ t('pw.current') }}</label>
            <input type="password" id="current_password" name="current_password" required autofocus>
        </div>
        <div class="form-group">
            <label for="new_password">{{ t('pw.new') }}</label>
            <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72">
            <small>{{ t('auth.password_hint') }}</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">{{ t('pw.confirm') }}</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72">
        </div>
        <div class="editor-actions">
            <a href="{{ url_for('dashboard.profile') }}" class="btn btn-secondary">{{ t('editor.cancel') }}</a>
            <button type="submit" class="btn">{{ t('pw.save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
